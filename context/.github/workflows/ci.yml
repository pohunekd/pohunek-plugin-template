name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The daily run repeats the pull request rows. The `previous-minor` row
    # is added once `CORE_TAG` is v0.45.0 or later: the row builds the kit
    # from the newest release of the previous minor, and only core 0.45 and
    # later ship `crates/plugin-kit` there (see `plugin-ci.yml`).
    - cron: "17 3 * * *"
  workflow_dispatch:

# A newer push to the same PR cancels its older run; main runs are never
# cancelled so every merge commit gets a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The plugin build runs code from crates.io, so the job holds no token that
# could sign or publish.
permissions:
  contents: read

jobs:
  plugin-ci:
    uses: zajca/pohunek/.github/workflows/plugin-ci.yml@v0.44.0
    with:
      core-tag: v0.44.0
      rows: '["release", "nightly"]'
      package-dir: package
    permissions:
      contents: read

  daily-failure:
    name: report a failing daily run
    needs: plugin-ci
    # Only the scheduled run files an issue, and only when the CI failed.
    if: github.event_name == 'schedule' && failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the daily CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="The scheduled plugin CI run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --search '"daily CI failing" in:title' --json number,title --jq 'map(select(.title == "daily CI failing"))[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'daily CI failing' --body "$body"
          fi
